<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Activity Manager</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body>
  <div class="app-container">
    <aside class="sidebar">
      <h2>Activity Hub</h2>
      <nav>
        <button id="nav-dash" class="nav-btn active" onclick="ui.showDashboard()">
          <span class="material-icons">dashboard</span> Dashboard
        </button>
        <button id="nav-hist" class="nav-btn" onclick="ui.showHistory()">
          <span class="material-icons">history</span> History
        </button>
      </nav>
      <button class="add-btn" onclick="ui.openModal()">
        <span class="material-icons">add</span> Add Activity
      </button>
    </aside>

    <main id="main-content">
      <!-- Injected by JavaScript -->
    </main>
  </div>

  <!-- Add / Edit Modal -->
  <div id="activity-modal" class="modal">
    <div class="modal-content">
      <span class="close-modal" onclick="ui.closeModal()">&times;</span>
      <h3 id="modal-title">Add Activity</h3>
      <form id="activity-form" onsubmit="ui.handleFormSubmit(event)">
        <input type="hidden" id="activity-id">

        <div class="form-group">
          <label for="title">Title *</label>
          <input type="text" id="title" required placeholder="e.g., Study System Design">
        </div>

        <div class="form-group">
          <label for="description">Description</label>
          <textarea id="description" placeholder="Optional notes..."></textarea>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="date">Date *</label>
            <input type="date" id="date" required>
          </div>
          <div class="form-group">
            <label for="time">Time *</label>
            <input type="time" id="time" required>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="category">Category</label>
            <select id="category">
              <option value="Study">Study</option>
              <option value="Work">Work</option>
              <option value="Health">Health</option>
              <option value="Personal">Personal</option>
              <option value="Other">Other</option>
            </select>
          </div>
          <div class="form-group">
            <label for="priority">Priority</label>
            <select id="priority">
              <option value="Low">Low</option>
              <option value="Medium" selected>Medium</option>
              <option value="High">High</option>
            </select>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="recurrence">Repeat</label>
            <select id="recurrence">
              <option value="none">None</option>
              <option value="daily">Daily</option>
              <option value="weekly">Weekly</option>
            </select>
          </div>
          <div class="form-group checkbox-cell">
            <label>
              <input type="checkbox" id="reminder" checked> Notification
            </label>
          </div>
        </div>

        <button type="submit" class="save-btn">Save</button>
      </form>
    </div>
  </div>
<aside class="sidebar">
  <h2>Activity Hub</h2>
  
  <!-- ADD THIS BLOCK -->
  <div class="datetime-container">
    <div id="live-time" class="live-time">--:--:--</div>
    <div id="live-date" class="live-date">Loading...</div>
  </div>
  <!-- END OF ADDED BLOCK -->

  <nav>
    <button id="nav-dash" class="nav-btn active" onclick="ui.showDashboard()">
      <span class="material-icons">dashboard</span> Dashboard
    </button>
...
  <script src="script.js"></script>
</body>
</html>
